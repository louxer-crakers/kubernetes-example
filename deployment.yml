apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  namespace: test
  labels:
    app: nginx
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        env:
          - name: DB_HOST
            value: test
          - name: S3_BUCKET
            valueFrom:
              configMapKeyRef:
                name: test         
                key: s3
          - name: DYNAMODB_TABLE
            valueFrom:
              secretKeyRef:
                name: test         
                key: dynamodb
        # envFrom:
        #   - configMapRef:
        #       name: myconfigmap
        #   - secretRef:
        #       name: myconfigmap
        volumeMounts:
        - name: test
          mountPath: "/usr/share/nginx/html"
          readOnly: true
      volumes:
      - name: test
        configMap:
          name: test
          items:
          - key: "index.html"
            path: "index.html"